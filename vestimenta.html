
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Informações de Vestimenta — Anna Clara</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    #vestimenta {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      background: #000;
    }
  </style>
</head>

<body>
  <img
    id="vestimenta"
    src="Vestimenta.jpg"
    alt="Informações de vestimenta para o aniversário de Anna Clara"
  >
</body>
</html>
