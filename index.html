
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Convite — Anna Clara | 15 anos</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    /* VÍDEO INICIAL */
    #videoContainer {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      z-index: 50;
      display: block;
      overflow: hidden;
      background: #000;
    }

    #video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      background: #000;
    }

    /* CAMADA CLICÁVEL PARA INICIAR O VÍDEO */
    #hotspot {
      position: absolute;
      inset: 0;
      z-index: 51;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    /* PRIMEIRA TELA APÓS O VÍDEO */
    #screen1 {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      z-index: 10;
      display: none;
      overflow: hidden;
      background: #000;
    }

    #screen1Image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    #screen1Click {
      position: absolute;
      top: 60%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(90vw, 360px);
      height: 18%;
      z-index: 12;
      cursor: pointer;
      touch-action: manipulation;
    }

    /* CONVITE PRINCIPAL */
    #screen2 {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      z-index: 10;
      display: none;
      overflow: hidden;
      background: #000;
    }

    #screen2Image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    /* BOTÕES CLICÁVEIS */
    #btnConfirmar,
    #btnMapa,
    #btnListaPresentes,
    #btnVestimenta {
      position: absolute;
      bottom: 24%;
      height: 18%;
      z-index: 11;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    #btnConfirmar {
      left: 7%;
      width: 27%;
    }

    #btnMapa {
      left: 34%;
      width: 15%;
    }

    #btnListaPresentes {
      left: 49%;
      width: 25%;
    }

    #btnVestimenta {
      left: 74%;
      width: 24%;
    }
  </style>
</head>

<body>

  <!-- VÍDEO INICIAL: CLIQUE PARA REPRODUZIR -->
  <div id="videoContainer">
    <video
      id="video"
      playsinline
      webkit-playsinline
      preload="auto"
      poster="porta.jpg"
    >
      <source src="video.mp4" type="video/mp4">
      Seu navegador não conseguiu carregar o vídeo.
    </video>

    <div
      id="hotspot"
      role="button"
      tabindex="0"
      aria-label="Clique para iniciar a animação"
    ></div>
  </div>

  <!-- MÚSICA DE FUNDO -->
  <audio id="bgMusic" loop preload="auto">
    <source src="musica.mp3" type="audio/mpeg">
  </audio>

  <!-- TELA 1 -->
  <div id="screen1">
    <img
      id="screen1Image"
      src="tela1.jpg"
      alt="Convite para entrar no País das Maravilhas"
    >

    <div
      id="screen1Click"
      role="button"
      tabindex="0"
      aria-label="Entrar no País das Maravilhas"
    ></div>
  </div>

  <!-- CONVITE PRINCIPAL -->
  <div id="screen2">
    <img
      id="screen2Image"
      src="tela2.jpg"
      alt="Convite de aniversário de 15 anos de Anna Clara"
    >

    <div
      id="btnConfirmar"
      role="button"
      tabindex="0"
      aria-label="Confirmar presença"
    ></div>

    <div
      id="btnMapa"
      role="button"
      tabindex="0"
      aria-label="Como chegar"
    ></div>

    <div
      id="btnListaPresentes"
      role="button"
      tabindex="0"
      aria-label="Lista de presentes"
    ></div>

    <div
      id="btnVestimenta"
      role="button"
      tabindex="0"
      aria-label="Informações de vestimenta"
    ></div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const videoContainer = document.getElementById("videoContainer");
      const video = document.getElementById("video");
      const hotspot = document.getElementById("hotspot");
      const music = document.getElementById("bgMusic");

      const screen1 = document.getElementById("screen1");
      const screen1Click = document.getElementById("screen1Click");
      const screen2 = document.getElementById("screen2");

      const btnConfirmar = document.getElementById("btnConfirmar");
      const btnMapa = document.getElementById("btnMapa");
      const btnListaPresentes =
        document.getElementById("btnListaPresentes");
      const btnVestimenta = document.getElementById("btnVestimenta");

      const links = {
        confirmar: "https://www.felicitous.com.br/annaclara15anos",
        presentes: "https://www.felicitous.com.br/annaclara15anos#lista-presentes",
        mapa: "https://www.google.com/maps/place/Espa%C3%A7o+Lara/@-19.7419054,-43.9989479,819m/data=!3m2!1e3!4b1!4m6!3m5!1s0xa68fa3df01b32b:0x22038fde363a0af1!8m2!3d-19.7419054!4d-43.9989479!16s%2Fg%2F11x20y1t75?entry=ttu",
        vestimenta: "vestimenta.html"
      };

      if (music) {
        music.volume = 0.4;
      }

      function ativarClique(elemento, acao) {
        elemento.addEventListener("click", acao);

        elemento.addEventListener("keydown", (evento) => {
          if (evento.key === "Enter" || evento.key === " ") {
            evento.preventDefault();
            acao();
          }
        });
      }

      /* CLIQUE NO VÍDEO → INICIA VÍDEO E MÚSICA */
      let iniciando = false;

      ativarClique(hotspot, () => {
        if (iniciando) return;
        iniciando = true;

        hotspot.style.display = "none";
        video.currentTime = 0;

        const tentativaVideo = video.play();

        if (music) {
          music.play().catch((erro) => {
            console.warn("A música não pôde iniciar:", erro);
          });
        }

        if (tentativaVideo && typeof tentativaVideo.catch === "function") {
          tentativaVideo.catch((erro) => {
            console.error("Erro ao reproduzir vídeo:", erro);
            hotspot.style.display = "block";
            iniciando = false;
          });
        }
      });

      /* VÍDEO → TELA 1 */
      video.addEventListener("ended", () => {
        videoContainer.style.display = "none";
        screen1.style.display = "block";

        if (music) {
          music.play().catch(() => {});
        }
      });

      /* TELA 1 → CONVITE PRINCIPAL */
      ativarClique(screen1Click, () => {
        screen1.style.display = "none";
        screen2.style.display = "block";

        if (music) {
          music.play().catch(() => {});
        }
      });

      /* CONFIRMAR PRESENÇA */
      ativarClique(btnConfirmar, () => {
        window.open(links.confirmar, "_blank", "noopener");
      });

      /* COMO CHEGAR */
      ativarClique(btnMapa, () => {
        window.open(links.mapa, "_blank", "noopener");
      });

      /* LISTA DE PRESENTES */
      ativarClique(btnListaPresentes, () => {
        window.open(links.presentes, "_blank", "noopener");
      });

      /* VESTIMENTA */
      ativarClique(btnVestimenta, () => {
        window.location.href = links.vestimenta;
      });

      /* ERROS */
      video.addEventListener("error", () => {
        console.error("Erro ao carregar video.mp4.");
      });

      console.log("Convite carregado. Clique no vídeo para iniciar.");
    });
  </script>

</body>
</html>
