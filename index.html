
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Convite de 15 anos — Anna Clara</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    .tela {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: none;
      background: #000;
    }

    .tela img,
    #video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    #videoContainer {
      display: block;
    }

    #hotspot {
      position: absolute;
      inset: 0;
      z-index: 5;
      cursor: pointer;
      background: transparent;
    }

    .area {
      position: absolute;
      display: block;
      border: 0;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    #screen1Click {
      position: absolute;
      inset: 0;
      cursor: pointer;
      background: transparent;
    }

    /* Áreas clicáveis do convite principal */

    #confirmar {
      left: 10%;
      top: 53%;
      width: 80%;
      height: 9%;
    }

    #comoChegar {
      left: 10%;
      top: 63%;
      width: 80%;
      height: 8%;
    }

    #presentes {
      left: 10%;
      top: 72%;
      width: 80%;
      height: 8%;
    }

    #vestimenta {
      left: 10%;
      top: 81%;
      width: 80%;
      height: 8%;
    }

    /* Botão para voltar da tela de vestimenta */

    #voltarVestimenta {
      position: absolute;
      top: 18px;
      left: 18px;
      z-index: 10;
      padding: 12px 18px;
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <!-- TELA INICIAL: VÍDEO -->
  <section id="videoContainer" class="tela">
    <video id="video" playsinline preload="auto">
      <source src="video.mp4" type="video/mp4">
      Seu navegador não consegue reproduzir este vídeo.
    </video>

    <div
      id="hotspot"
      role="button"
      tabindex="0"
      aria-label="Clique para iniciar o convite">
    </div>
  </section>

  <!-- TELA 1: ENTRADA NO PAÍS DAS MARAVILHAS -->
  <section id="screen1" class="tela">
    <img src="tela1.jpg" alt="Entre no País das Maravilhas">

    <div
      id="screen1Click"
      role="button"
      tabindex="0"
      aria-label="Entrar no convite">
    </div>
  </section>

  <!-- TELA 2: CONVITE PRINCIPAL -->
  <section id="screen2" class="tela">
    <img src="tela2.jpg" alt="Convite de 15 anos de Anna Clara">

    <a
      id="confirmar"
      class="area"
      href="https://www.felicitous.com.br/annaclara15anos"
      target="_blank"
      rel="noopener"
      aria-label="Confirmar presença">
    </a>

    <a
      id="comoChegar"
      class="area"
      href="https://www.google.com/maps/place/Espa%C3%A7o+Lara/@-19.7419054,-43.9989479,819m/data=!3m2!1e3!4b1!4m6!3m5!1s0xa68fa3df01b32b:0x22038fde363a0af1!8m2!3d-19.7419054!4d-43.9989479!16s%2Fg%2F11x20y1t75?entry=ttu"
      target="_blank"
      rel="noopener"
      aria-label="Como chegar">
    </a>

    <a
      id="presentes"
      class="area"
      href="https://www.felicitous.com.br/annaclara15anos#lista-presentes"
      target="_blank"
      rel="noopener"
      aria-label="Lista de presentes">
    </a>

    <button
      id="vestimenta"
      class="area"
      type="button"
      aria-label="Informações de vestimenta">
    </button>
  </section>

  <!-- TELA 3: VESTIMENTA DENTRO DO MESMO SITE -->
  <section id="screenVestimenta" class="tela">
    <img
      src="Vestimenta.jpg"
      alt="Informações de vestimenta para o aniversário de Anna Clara">

    <button id="voltarVestimenta" type="button">
      ← Voltar ao convite
    </button>
  </section>

  <!-- MÚSICA: PERMANECE NO INDEX DURANTE A NAVEGAÇÃO -->
  <audio id="music" src="musica.mp3" loop preload="auto"></audio>

  <script>
    const video = document.getElementById("video");
    const music = document.getElementById("music");

    const videoContainer = document.getElementById("videoContainer");
    const hotspot = document.getElementById("hotspot");

    const screen1 = document.getElementById("screen1");
    const screen2 = document.getElementById("screen2");
    const screenVestimenta = document.getElementById("screenVestimenta");

    const screen1Click = document.getElementById("screen1Click");
    const botaoVestimenta = document.getElementById("vestimenta");
    const botaoVoltar = document.getElementById("voltarVestimenta");

    let iniciado = false;

    function mostrarTela(tela) {
      videoContainer.style.display = "none";
      screen1.style.display = "none";
      screen2.style.display = "none";
      screenVestimenta.style.display = "none";

      tela.style.display = "block";
    }

    function iniciarConvite() {
      if (iniciado) return;

      iniciado = true;
      hotspot.style.display = "none";

      music.volume = 0.7;

      music.play().catch(function (erro) {
        console.warn("Não foi possível iniciar a música:", erro);
      });

      video.currentTime = 0;

      video.play().catch(function (erro) {
        console.error("Não foi possível iniciar o vídeo:", erro);
        iniciado = false;
        hotspot.style.display = "block";
      });
    }

    hotspot.addEventListener("click", iniciarConvite);

    hotspot.addEventListener("keydown", function (evento) {
      if (evento.key === "Enter" || evento.key === " ") {
        evento.preventDefault();
        iniciarConvite();
      }
    });

    video.addEventListener("ended", function () {
      mostrarTela(screen1);
    });

    function entrarNoConvite() {
      mostrarTela(screen2);
    }

    screen1Click.addEventListener("click", entrarNoConvite);

    screen1Click.addEventListener("keydown", function (evento) {
      if (evento.key === "Enter" || evento.key === " ") {
        evento.preventDefault();
        entrarNoConvite();
      }
    });

    /* Abre a vestimenta sem recarregar a página */
    botaoVestimenta.addEventListener("click", function () {
      mostrarTela(screenVestimenta);
    });

    /* Retorna ao convite sem reiniciar a música */
    botaoVoltar.addEventListener("click", function () {
      mostrarTela(screen2);
    });
  </script>

</body>
</html>
