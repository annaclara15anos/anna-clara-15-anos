
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Anna Clara | 15 Anos</title>

  <style>
    :root {
      --fundo: #000;
      --texto: #fff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--fundo);
      font-family: Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
      overscroll-behavior: none;
    }

    .tela {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      display: none;
      overflow: hidden;
      background: var(--fundo);
    }

    /* Área da imagem: mantém a proporção original */
    .palco {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      overflow: hidden;
      background: var(--fundo);
    }

    .palco img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
      -webkit-user-drag: none;
      user-select: none;
    }

    /* Vídeo inicial */
    #videoContainer {
      display: block;
    }

    #video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      background: #000;
    }

    #hotspot {
      position: absolute;
      inset: 0;
      z-index: 5;
      border: 0;
      background: transparent;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    /* Áreas clicáveis relativas à imagem do convite */
    .area {
      position: absolute;
      display: block;
      padding: 0;
      margin: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      appearance: none;
      -webkit-appearance: none;
    }

    /*
      POSIÇÃO DOS BOTÕES SOBRE A IMAGEM
      As porcentagens são relativas ao palco da imagem,
      e não à tela inteira do iPhone.
    */

    #confirmar {
      left: 11.2%;
      top: 65.5%;
      width: 19.8%;
      height: 11.5%;
    }

    #comoChegar {
      left: 31.7%;
      top: 65.5%;
      width: 19.8%;
      height: 11.5%;
    }

    #presentes {
      left: 52.2%;
      top: 65.5%;
      width: 19.8%;
      height: 11.5%;
    }

    #vestimenta {
      left: 72.7%;
      top: 65.5%;
      width: 18.8%;
      height: 11.5%;
    }

    /* Clique para avançar da primeira tela */
    #screen1Click {
      position: absolute;
      inset: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    /* Botão de retorno da tela de vestimenta */
    #voltarVestimenta {
      position: fixed;
      z-index: 20;
      top: max(12px, env(safe-area-inset-top));
      left: max(12px, env(safe-area-inset-left));
      padding: 12px 16px;
      border: 1px solid rgba(255, 255, 255, 0.75);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.78);
      color: #fff;
      font-size: 15px;
      line-height: 1.2;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    a:focus-visible,
    button:focus-visible {
      outline: 2px solid white;
      outline-offset: 2px;
    }
  </style>
</head>

<body>

  <!-- TELA INICIAL: VÍDEO -->
  <section id="videoContainer" class="tela" aria-label="Abertura do convite">
    <video
      id="video"
      playsinline
      webkit-playsinline
      preload="auto"
      aria-label="Vídeo de abertura do convite">
      <source src="video.mp4" type="video/mp4">
      Seu navegador não conseguiu reproduzir este vídeo.
    </video>

    <button
      id="hotspot"
      type="button"
      aria-label="Toque para iniciar o vídeo e a música">
    </button>
  </section>

  <!-- TELA 1 -->
  <section id="screen1" class="tela" aria-label="Entrada no País das Maravilhas">
    <div class="palco" id="palco1">
      <img
        id="imagem1"
        src="tela1.jpg"
        alt="Entre no País das Maravilhas"
        draggable="false">

      <button
        id="screen1Click"
        type="button"
        aria-label="Avançar para o convite">
      </button>
    </div>
  </section>

  <!-- TELA 2: CONVITE PRINCIPAL -->
  <section id="screen2" class="tela" aria-label="Convite de aniversário">
    <div class="palco" id="palco2">
      <img
        id="imagem2"
        src="tela2.jpg"
        alt="Convite de 15 anos de Anna Clara"
        draggable="false">

      <a
        id="confirmar"
        class="area"
        href="https://www.felicitous.com.br/annaclara15anos#lista-convidados"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Confirmar presença">
      </a>

      <a
        id="comoChegar"
        class="area"
        href="https://www.google.com/maps/place/Espa%C3%A7o+Lara/@-19.7419054,-43.9989479,819m/data=!3m2!1e3!4b1!4m6!3m5!1s0xa68fa3df01b32b:0x22038fde363a0af1!8m2!3d-19.7419054!4d-43.9989479!16s%2Fg%2F11x20y1t75?entry=ttu"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Como chegar ao Espaço Lara">
      </a>

      <a
        id="presentes"
        class="area"
        href="https://www.felicitous.com.br/annaclara15anos#lista-presentes"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Lista de presentes">
      </a>

      <button
        id="vestimenta"
        class="area"
        type="button"
        aria-label="Ver informações de vestimenta">
      </button>
    </div>
  </section>

  <!-- TELA 3: VESTIMENTA NO MESMO SITE -->
  <section id="screenVestimenta" class="tela" aria-label="Informações de vestimenta">
    <div class="palco" id="palcoVestimenta">
      <img
        id="imagemVestimenta"
        src="Vestimenta.jpg"
        alt="Informações de vestimenta para o aniversário de Anna Clara"
        draggable="false">
    </div>

    <button id="voltarVestimenta" type="button">
      ← Voltar ao convite
    </button>
  </section>

  <!-- MÚSICA DE FUNDO -->
  <audio id="music" src="musica.mp3" loop preload="auto"></audio>

  <script>
    (function () {
      "use strict";

      const video = document.getElementById("video");
      const music = document.getElementById("music");

      const videoContainer = document.getElementById("videoContainer");
      const hotspot = document.getElementById("hotspot");

      const screen1 = document.getElementById("screen1");
      const screen2 = document.getElementById("screen2");
      const screenVestimenta = document.getElementById("screenVestimenta");

      const imagem1 = document.getElementById("imagem1");
      const imagem2 = document.getElementById("imagem2");
      const imagemVestimenta = document.getElementById("imagemVestimenta");

      const palco1 = document.getElementById("palco1");
      const palco2 = document.getElementById("palco2");
      const palcoVestimenta = document.getElementById("palcoVestimenta");

      const botaoAvancar = document.getElementById("screen1Click");
      const botaoVestimenta = document.getElementById("vestimenta");
      const botaoVoltar = document.getElementById("voltarVestimenta");

      let iniciado = false;
      let iniciando = false;

      /*
        Ajusta cada imagem para caber na tela sem distorção.
        Os botões ficam dentro do mesmo palco da imagem.
      */
      function ajustarPalco(imagem, palco) {
        if (!imagem.naturalWidth || !imagem.naturalHeight) {
          return;
        }

        const proporcao = imagem.naturalWidth / imagem.naturalHeight;
        const larguraTela = document.documentElement.clientWidth;
        const alturaTela = window.innerHeight;

        let largura = larguraTela;
        let altura = largura / proporcao;

        if (altura > alturaTela) {
          altura = alturaTela;
          largura = altura * proporcao;
        }

        palco.style.width = largura + "px";
        palco.style.height = altura + "px";
      }

      function ajustarTodasImagens() {
        ajustarPalco(imagem1, palco1);
        ajustarPalco(imagem2, palco2);
        ajustarPalco(imagemVestimenta, palcoVestimenta);
      }

      [imagem1, imagem2, imagemVestimenta].forEach(function (imagem) {
        imagem.addEventListener("load", ajustarTodasImagens);
      });

      window.addEventListener("resize", ajustarTodasImagens);
      window.addEventListener("orientationchange", function () {
        window.setTimeout(ajustarTodasImagens, 250);
      });

      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", ajustarTodasImagens);
      }

      ajustarTodasImagens();

      function mostrarTela(tela) {
        videoContainer.style.display = "none";
        screen1.style.display = "none";
        screen2.style.display = "none";
        screenVestimenta.style.display = "none";

        tela.style.display = "block";
        ajustarTodasImagens();
      }

      /*
        A reprodução é iniciada somente após o toque da pessoa,
        para respeitar as regras de mídia do Safari no iPhone.
      */
      async function iniciarConvite() {
        if (iniciado || iniciando) return;

        iniciando = true;
        hotspot.disabled = true;

        try {
          music.volume = 0.7;

          const promessaMusica = music.play().catch(function (erro) {
            console.warn("A música não iniciou:", erro);
          });

          video.currentTime = 0;

          await video.play();

          iniciado = true;
          hotspot.style.display = "none";

          await promessaMusica;
        } catch (erro) {
          console.error("Não foi possível iniciar o vídeo:", erro);

          hotspot.disabled = false;
          hotspot.style.display = "block";
        } finally {
          iniciando = false;
        }
      }

      hotspot.addEventListener("click", iniciarConvite);

      video.addEventListener("ended", function () {
        mostrarTela(screen1);
      });

      botaoAvancar.addEventListener("click", function () {
        mostrarTela(screen2);
      });

      botaoVestimenta.addEventListener("click", function () {
        mostrarTela(screenVestimenta);
      });

      botaoVoltar.addEventListener("click", function () {
        mostrarTela(screen2);
      });

      /*
        Não reinicia a música ao trocar de tela.
        Se o Safari interromper o áudio ao voltar de uma pausa,
        tenta retomá-lo após a próxima interação do usuário.
      */
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden && iniciado && music.paused) {
          music.play().catch(function (erro) {
            console.warn("Toque na página para retomar a música:", erro);
          });
        }
      });

      document.addEventListener("touchend", function retomarAudio() {
        if (iniciado && music.paused) {
          music.play().catch(function () {});
        }
      }, { passive: true });
    })();
  </script>

</body>
</html>
