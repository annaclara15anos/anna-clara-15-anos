
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Convite — Anna Clara</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    /* PORTA INICIAL */
    #cover {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: #000 url("porta.jpg") center / contain no-repeat;
    }

    #hotspot {
      position: absolute;
      top: 20%;
      left: 20%;
      width: 60%;
      height: 60%;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    /* VÍDEO DE ENTRADA */
    #videoContainer {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      background: #000;
    }

    #video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    /* PRIMEIRA TELA */
    #screen1 {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: none;
      background: #000 url("tela1.jpg") center / contain no-repeat;
    }

    #screen1Click {
      position: absolute;
      top: 60%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(80vw, 340px);
      height: 120px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    /* CONVITE PRINCIPAL */
    #screen2 {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: none;
      background: #000 url("tela2.jpg") center / contain no-repeat;
    }

    /* ÁREAS CLICÁVEIS DOS BOTÕES */
    #btnConfirmar,
    #btnMapa,
    #btnListaPresentes,
    #btnVestimenta {
      position: absolute;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    /* CONFIRMAR PRESENÇA */
    #btnConfirmar {
      left: 7%;
      bottom: 25%;
      width: 26%;
      height: 17%;
    }

    /* COMO CHEGAR */
    #btnMapa {
      left: 34%;
      bottom: 25%;
      width: 15%;
      height: 17%;
    }

    /* LISTA DE PRESENTES */
    #btnListaPresentes {
      left: 49%;
      bottom: 25%;
      width: 25%;
      height: 17%;
    }

    /* INFORMAÇÕES DE VESTIMENTA */
    #btnVestimenta {
      left: 74%;
      bottom: 25%;
      width: 23%;
      height: 17%;
    }

    @media (max-width: 600px) {
      #screen1Click {
        width: 90vw;
        height: 15vh;
      }
    }
  </style>
</head>

<body>

  <!-- PORTA -->
  <div id="cover">
    <div
      id="hotspot"
      role="button"
      tabindex="0"
      aria-label="Entrar no convite"
    ></div>
  </div>

  <!-- VÍDEO DE ENTRADA -->
  <div id="videoContainer">
    <video
      id="video"
      playsinline
      webkit-playsinline
      preload="auto"
    >
      <source src="video.mp4" type="video/mp4">
      Seu navegador não conseguiu carregar o vídeo.
    </video>
  </div>

  <!-- MÚSICA DE FUNDO -->
  <audio id="bgMusic" loop preload="auto">
    <source src="musica.mp3" type="audio/mpeg">
  </audio>

  <!-- TELA 1 -->
  <div id="screen1">
    <div
      id="screen1Click"
      role="button"
      tabindex="0"
      aria-label="Entrar no País das Maravilhas"
    ></div>
  </div>

  <!-- CONVITE PRINCIPAL -->
  <div id="screen2">

    <div
      id="btnConfirmar"
      role="button"
      tabindex="0"
      aria-label="Confirmar presença"
    ></div>

    <div
      id="btnMapa"
      role="button"
      tabindex="0"
      aria-label="Como chegar"
    ></div>

    <div
      id="btnListaPresentes"
      role="button"
      tabindex="0"
      aria-label="Lista de presentes"
    ></div>

    <div
      id="btnVestimenta"
      role="button"
      tabindex="0"
      aria-label="Informações de vestimenta"
    ></div>

  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const cover = document.getElementById("cover");
      const hotspot = document.getElementById("hotspot");

      const videoContainer = document.getElementById("videoContainer");
      const video = document.getElementById("video");

      const music = document.getElementById("bgMusic");

      const screen1 = document.getElementById("screen1");
      const screen1Click = document.getElementById("screen1Click");
      const screen2 = document.getElementById("screen2");

      const btnConfirmar = document.getElementById("btnConfirmar");
      const btnMapa = document.getElementById("btnMapa");
      const btnListaPresentes = document.getElementById("btnListaPresentes");
      const btnVestimenta = document.getElementById("btnVestimenta");

      const links = {
        confirmar:
          "https://www.felicitous.com.br/annaclara15anos",

        presentes:
          "https://www.felicitous.com.br/annaclara15anos#lista-presentes",

        mapa:
          "https://www.google.com/maps/place/Espa%C3%A7o+Lara/@-19.7419054,-43.9989479,819m/data=!3m2!1e3!4b1!4m6!3m5!1s0xa68fa3df01b32b:0x22038fde363a0af1!8m2!3d-19.7419054!4d-43.9989479!16s%2Fg%2F11x20y1t75?entry=ttu",

        vestimenta: "vestimenta.html"
      };

      if (music) {
        music.volume = 0.4;
      }

      function ativarClique(elemento, acao) {
        elemento.addEventListener("click", acao);

        elemento.addEventListener("keydown", (evento) => {
          if (evento.key === "Enter" || evento.key === " ") {
            evento.preventDefault();
            acao();
          }
        });
      }

      /* PORTA → VÍDEO E MÚSICA */
      ativarClique(hotspot, async () => {
        cover.style.display = "none";
        screen1.style.display = "none";
        screen2.style.display = "none";
        videoContainer.style.display = "block";

        video.currentTime = 0;

        const tentativaVideo = video.play();

        if (music) {
          music.play().catch((erro) => {
            console.warn("A música não pôde iniciar:", erro);
          });
        }

        try {
          await tentativaVideo;
        } catch (erro) {
          console.error("Erro ao reproduzir o vídeo:", erro);

          videoContainer.style.display = "none";
          cover.style.display = "block";

          alert(
            "Não foi possível reproduzir o vídeo. Verifique sua conexão e tente novamente."
          );
        }
      });

      /* VÍDEO → TELA 1 */
      video.addEventListener("ended", () => {
        videoContainer.style.display = "none";
        screen1.style.display = "block";

        if (music) {
          music.play().catch(() => {});
        }
      });

      /* TELA 1 → TELA 2 */
      ativarClique(screen1Click, () => {
        screen1.style.display = "none";
        screen2.style.display = "block";

        if (music) {
          music.play().catch(() => {});
        }
      });

      /* CONFIRMAR PRESENÇA */
      ativarClique(btnConfirmar, () => {
        window.open(links.confirmar, "_blank", "noopener");
      });

      /* COMO CHEGAR */
      ativarClique(btnMapa, () => {
        window.open(links.mapa, "_blank", "noopener");
      });

      /* LISTA DE PRESENTES */
      ativarClique(btnListaPresentes, () => {
        window.open(links.presentes, "_blank", "noopener");
      });

      /* INFORMAÇÕES DE VESTIMENTA */
      ativarClique(btnVestimenta, () => {
        window.location.href = links.vestimenta;
      });

      /* ERRO DE CARREGAMENTO DO VÍDEO */
      video.addEventListener("error", () => {
        console.error(
          "Não foi possível carregar video.mp4. Verifique o arquivo e sua codificação."
        );
      });
    });
  </script>

</body>
</html>
