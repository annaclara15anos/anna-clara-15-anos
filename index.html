
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Convite — Anna Clara | 15 anos</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    /* PORTA INICIAL */
    #cover {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 100;
      background: #000 url("porta.jpg") center center / contain no-repeat;
    }

    /* TODA A TELA INICIAL É CLICÁVEL */
    #hotspot {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 101;
      cursor: pointer;
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    /* VÍDEO DE ENTRADA */
    #videoContainer {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 50;
      display: none;
      background: #000;
    }

    #video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    /* PRIMEIRA TELA APÓS O VÍDEO */
    #screen1 {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      display: none;
      background: #000 url("tela1.jpg") center center / contain no-repeat;
    }

    #screen1Click {
      position: absolute;
      top: 60%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(90vw, 360px);
      height: 18%;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    /* CONVITE PRINCIPAL */
    #screen2 {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      display: none;
      background: #000 url("tela2.jpg") center center / contain no-repeat;
    }

    /* ÁREAS CLICÁVEIS DOS QUATRO BOTÕES */
    #btnConfirmar,
    #btnMapa,
    #btnListaPresentes,
    #btnVestimenta {
      position: absolute;
      bottom: 24%;
      height: 18%;
      z-index: 11;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    /* CONFIRMAR PRESENÇA */
    #btnConfirmar {
      left: 7%;
      width: 27%;
    }

    /* COMO CHEGAR */
    #btnMapa {
      left: 34%;
      width: 15%;
    }

    /* LISTA DE PRESENTES */
    #btnListaPresentes {
      left: 49%;
      width: 25%;
    }

    /* INFORMAÇÕES DE VESTIMENTA */
    #btnVestimenta {
      left: 74%;
      width: 24%;
    }
  </style>
</head>

<body>

  <!-- PORTA INICIAL -->
  <div id="cover">
    <div
      id="hotspot"
      role="button"
      tabindex="0"
      aria-label="Clique para entrar no País das Maravilhas"
    ></div>
  </div>

  <!-- VÍDEO -->
  <div id="videoContainer">
    <video
      id="video"
      playsinline
      webkit-playsinline
      preload="auto"
    >
      <source src="video.mp4" type="video/mp4">
      Seu navegador não conseguiu carregar o vídeo.
    </video>
  </div>

  <!-- MÚSICA DE FUNDO -->
  <audio id="bgMusic" loop preload="auto">
    <source src="musica.mp3" type="audio/mpeg">
  </audio>

  <!-- TELA 1 -->
  <div id="screen1">
    <div
      id="screen1Click"
      role="button"
      tabindex="0"
      aria-label="Entrar no País das Maravilhas"
    ></div>
  </div>

  <!-- CONVITE PRINCIPAL -->
  <div id="screen2">

    <div
      id="btnConfirmar"
      role="button"
      tabindex="0"
      aria-label="Confirmar presença"
    ></div>

    <div
      id="btnMapa"
      role="button"
      tabindex="0"
      aria-label="Como chegar ao evento"
    ></div>

    <div
      id="btnListaPresentes"
      role="button"
      tabindex="0"
      aria-label="Lista de presentes"
    ></div>

    <div
      id="btnVestimenta"
      role="button"
      tabindex="0"
      aria-label="Informações de vestimenta"
    ></div>

  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {

      const cover = document.getElementById("cover");
      const hotspot = document.getElementById("hotspot");

      const videoContainer = document.getElementById("videoContainer");
      const video = document.getElementById("video");

      const music = document.getElementById("bgMusic");

      const screen1 = document.getElementById("screen1");
      const screen1Click = document.getElementById("screen1Click");
      const screen2 = document.getElementById("screen2");

      const btnConfirmar = document.getElementById("btnConfirmar");
      const btnMapa = document.getElementById("btnMapa");
      const btnListaPresentes =
        document.getElementById("btnListaPresentes");
      const btnVestimenta = document.getElementById("btnVestimenta");

      const links = {
        confirmar:
          "https://www.felicitous.com.br/annaclara15anos",

        presentes:
          "https://www.felicitous.com.br/annaclara15anos#lista-presentes",

        mapa:
          "https://www.google.com/maps/place/Espa%C3%A7o+Lara/@-19.7419054,-43.9989479,819m/data=!3m2!1e3!4b1!4m6!3m5!1s0xa68fa3df01b32b:0x22038fde363a0af1!8m2!3d-19.7419054!4d-43.9989479!16s%2Fg%2F11x20y1t75?entry=ttu",

        vestimenta: "vestimenta.html"
      };

      if (music) {
        music.volume = 0.4;
      }

      /* CLIQUE E TECLADO */
      function ativarClique(elemento, acao) {
        elemento.addEventListener("click", acao);

        elemento.addEventListener("keydown", (evento) => {
          if (
            evento.key === "Enter" ||
            evento.key === " "
          ) {
            evento.preventDefault();
            acao();
          }
        });
      }

      /* PORTA → VÍDEO + MÚSICA */
      let iniciando = false;

      ativarClique(hotspot, () => {
        if (iniciando) return;
        iniciando = true;

        cover.style.display = "none";
        screen1.style.display = "none";
        screen2.style.display = "none";
        videoContainer.style.display = "block";

        video.currentTime = 0;

        /* Tentar iniciar a música no gesto do visitante */
        if (music) {
          music.play().catch((erro) => {
            console.warn("A música não iniciou:", erro);
          });
        }

        /* Iniciar o vídeo */
        const reproducao = video.play();

        if (reproducao && typeof reproducao.catch === "function") {
          reproducao.catch((erro) => {
            console.error("Erro ao iniciar o vídeo:", erro);

            videoContainer.style.display = "none";
            cover.style.display = "block";
            iniciando = false;

            alert(
              "Não foi possível iniciar o vídeo. Verifique sua conexão e tente novamente."
            );
          });
        }
      });

      /* VÍDEO → TELA 1 */
      video.addEventListener("ended", () => {
        videoContainer.style.display = "none";
        screen1.style.display = "block";

        if (music) {
          music.play().catch(() => {});
        }
      });

      /* TELA 1 → CONVITE PRINCIPAL */
      ativarClique(screen1Click, () => {
        screen1.style.display = "none";
        screen2.style.display = "block";

        if (music) {
          music.play().catch(() => {});
        }
      });

      /* CONFIRMAR PRESENÇA */
      ativarClique(btnConfirmar, () => {
        window.open(links.confirmar, "_blank", "noopener");
      });

      /* COMO CHEGAR */
      ativarClique(btnMapa, () => {
        window.open(links.mapa, "_blank", "noopener");
      });

      /* LISTA DE PRESENTES */
      ativarClique(btnListaPresentes, () => {
        window.open(links.presentes, "_blank", "noopener");
      });

      /* INFORMAÇÕES DE VESTIMENTA */
      ativarClique(btnVestimenta, () => {
        window.location.href = links.vestimenta;
      });

      /* ERROS DE CARREGAMENTO */
      video.addEventListener("error", () => {
        console.error(
          "Erro ao carregar video.mp4. Confira se o arquivo existe e se está codificado em um formato compatível."
        );
      });

      console.log("Convite carregado. Aguardando clique na porta.");
    });
  </script>

</body>
</html>
