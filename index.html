
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">

  <title>Anna Clara | 15 Anos</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
      overscroll-behavior: none;
    }

    .tela {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      display: none;
      overflow: hidden;
      background: #000;
    }

    /* IMAGENS DO CONVITE */

    .palco {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      overflow: hidden;
      background: #000;
    }

    .palco img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* TELA INICIAL */

    #videoContainer {
      display: block;
      position: fixed;
      inset: 0;
      background: #000;
    }

    #video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      background: #000;
    }

    /* IMAGEM ORIGINAL porta.jpg */

    #capaInicial {
      position: absolute;
      inset: 0;
      z-index: 5;
      width: 100%;
      height: 100%;
      cursor: pointer;
      background: #000;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    #capaInicial img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* MENSAGEM DE ERRO DO VÍDEO */

    #erroVideo {
      display: none;
      position: absolute;
      z-index: 10;
      left: 8%;
      right: 8%;
      bottom: 10%;
      padding: 14px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
      pointer-events: none;
    }

    /* ÁREAS CLICÁVEIS */

    .area {
      position: absolute;
      display: block;
      padding: 0;
      margin: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      appearance: none;
      -webkit-appearance: none;
    }

    /* POSIÇÃO DOS QUATRO BOTÕES */

    #confirmar {
      left: 11.2%;
      top: 65.5%;
      width: 19.8%;
      height: 11.5%;
    }

    #comoChegar {
      left: 31.7%;
      top: 65.5%;
      width: 19.8%;
      height: 11.5%;
    }

    #presentes {
      left: 52.2%;
      top: 65.5%;
      width: 19.8%;
      height: 11.5%;
    }

    #vestimenta {
      left: 72.7%;
      top: 65.5%;
      width: 18.8%;
      height: 11.5%;
    }

    /* AVANÇAR DA PRIMEIRA TELA */

    #screen1Click {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: transparent;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    /* BOTÃO VOLTAR DA VESTIMENTA */

    #voltarVestimenta {
      position: fixed;
      z-index: 20;
      top: max(12px, env(safe-area-inset-top));
      left: max(12px, env(safe-area-inset-left));
      padding: 12px 16px;
      border: 1px solid rgba(255, 255, 255, 0.75);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.78);
      color: #fff;
      font-size: 15px;
      line-height: 1.2;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    a:focus-visible,
    button:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }

  </style>
</head>

<body>

  <!-- TELA INICIAL: IMAGEM ORIGINAL DA PORTA E VÍDEO -->

  <section
    id="videoContainer"
    class="tela"
    aria-label="Abertura do convite">

    <video
      id="video"
      playsinline
      webkit-playsinline="true"
      preload="auto"
      muted
      aria-label="Vídeo de abertura do convite">

      <source src="./video.mp4" type="video/mp4">

      Seu navegador não conseguiu reproduzir o vídeo.
    </video>

    <!-- IMAGEM QUE JÁ EXISTE NO GITHUB -->
    <div
      id="capaInicial"
      role="button"
      tabindex="0"
      aria-label="Toque na porta para iniciar o convite">

      <img
        src="./porta.jpg"
        alt="Porta mágica do País das Maravilhas"
        draggable="false">
    </div>

    <p id="erroVideo" role="status">
      Não foi possível reproduzir o vídeo.
      Verifique se o arquivo video.mp4 está disponível.
    </p>

  </section>


  <!-- TELA 1: ENTRADA NO PAÍS DAS MARAVILHAS -->

  <section
    id="screen1"
    class="tela"
    aria-label="Entrada no País das Maravilhas">

    <div class="palco" id="palco1">

      <img
        id="imagem1"
        src="./tela1.jpg"
        alt="Entre no País das Maravilhas"
        draggable="false">

      <button
        id="screen1Click"
        type="button"
        aria-label="Avançar para o convite">
      </button>

    </div>
  </section>


  <!-- TELA 2: CONVITE PRINCIPAL -->

  <section
    id="screen2"
    class="tela"
    aria-label="Convite de aniversário">

    <div class="palco" id="palco2">

      <img
        id="imagem2"
        src="./tela2.jpg"
        alt="Convite de 15 anos de Anna Clara"
        draggable="false">

      <!-- CONFIRMAR PRESENÇA -->

      <a
        id="confirmar"
        class="area"
        href="https://www.felicitous.com.br/annaclara15anos#home"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Confirmar presença">
      </a>

      <!-- COMO CHEGAR -->

      <a
        id="comoChegar"
        class="area"
        href="https://www.google.com/maps/place/Espa%C3%A7o+Lara/@-19.7419054,-43.9989479,819m/data=!3m2!1e3!4b1!4m6!3m5!1s0xa68fa3df01b32b:0x22038fde363a0af1!8m2!3d-19.7419054!4d-43.9989479!16s%2Fg%2F11x20y1t75?entry=ttu"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Como chegar ao Espaço Lara">
      </a>

      <!-- LISTA DE PRESENTES -->

      <a
        id="presentes"
        class="area"
        href="https://www.felicitous.com.br/annaclara15anos#lista-presentes"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Lista de presentes">
      </a>

      <!-- INFORMAÇÕES DE VESTIMENTA -->

      <button
        id="vestimenta"
        class="area"
        type="button"
        aria-label="Ver informações de vestimenta">
      </button>

    </div>
  </section>


  <!-- TELA 3: VESTIMENTA DENTRO DO MESMO SITE -->

  <section
    id="screenVestimenta"
    class="tela"
    aria-label="Informações de vestimenta">

    <div class="palco" id="palcoVestimenta">

      <img
        id="imagemVestimenta"
        src="./Vestimenta.jpg"
        alt="Informações de vestimenta para o aniversário de Anna Clara"
        draggable="false">

    </div>

    <button id="voltarVestimenta" type="button">
      ← Voltar ao convite
    </button>

  </section>


  <!-- MÚSICA DE FUNDO -->

  <audio
    id="music"
    src="./musica.mp3"
    loop
    preload="auto">
  </audio>


  <script>

    (function () {

      "use strict";

      const video = document.getElementById("video");
      const music = document.getElementById("music");

      const videoContainer =
        document.getElementById("videoContainer");

      const capaInicial =
        document.getElementById("capaInicial");

      const erroVideo =
        document.getElementById("erroVideo");

      const screen1 =
        document.getElementById("screen1");

      const screen2 =
        document.getElementById("screen2");

      const screenVestimenta =
        document.getElementById("screenVestimenta");

      const imagem1 =
        document.getElementById("imagem1");

      const imagem2 =
        document.getElementById("imagem2");

      const imagemVestimenta =
        document.getElementById("imagemVestimenta");

      const palco1 =
        document.getElementById("palco1");

      const palco2 =
        document.getElementById("palco2");

      const palcoVestimenta =
        document.getElementById("palcoVestimenta");

      const botaoAvancar =
        document.getElementById("screen1Click");

      const botaoVestimenta =
        document.getElementById("vestimenta");

      const botaoVoltar =
        document.getElementById("voltarVestimenta");

      let iniciado = false;
      let iniciando = false;


      /* AJUSTE DAS IMAGENS */

      function ajustarPalco(imagem, palco) {

        if (!imagem.naturalWidth || !imagem.naturalHeight) {
          return;
        }

        const larguraTela =
          document.documentElement.clientWidth;

        const alturaTela =
          document.documentElement.clientHeight;

        const proporcao =
          imagem.naturalWidth / imagem.naturalHeight;

        let largura = larguraTela;
        let altura = largura / proporcao;

        if (altura > alturaTela) {
          altura = alturaTela;
          largura = altura * proporcao;
        }

        palco.style.width = largura + "px";
        palco.style.height = altura + "px";

      }


      function ajustarTodasImagens() {

        ajustarPalco(imagem1, palco1);
        ajustarPalco(imagem2, palco2);
        ajustarPalco(imagemVestimenta, palcoVestimenta);

      }


      [
        imagem1,
        imagem2,
        imagemVestimenta
      ].forEach(function (imagem) {

        imagem.addEventListener(
          "load",
          ajustarTodasImagens
        );

      });


      window.addEventListener(
        "resize",
        ajustarTodasImagens
      );


      window.addEventListener(
        "orientationchange",
        function () {

          window.setTimeout(
            ajustarTodasImagens,
            300
          );

        }
      );


      if (window.visualViewport) {

        window.visualViewport.addEventListener(
          "resize",
          ajustarTodasImagens
        );

      }


      ajustarTodasImagens();


      /* NAVEGAÇÃO ENTRE AS TELAS */

      function mostrarTela(tela) {

        videoContainer.style.display = "none";
        screen1.style.display = "none";
        screen2.style.display = "none";
        screenVestimenta.style.display = "none";

        tela.style.display = "block";

        ajustarTodasImagens();

      }


      /* INICIAR VÍDEO E MÚSICA */

      function iniciarConvite() {

        if (iniciado || iniciando) {
          return;
        }

        iniciando = true;
        erroVideo.style.display = "none";

        video.muted = true;
        video.playsInline = true;

        video.setAttribute("playsinline", "");
        video.setAttribute("webkit-playsinline", "");

        music.volume = 0.7;
        music.muted = false;

        try {

          video.currentTime = 0;

        } catch (erro) {

          console.warn(
            "Não foi possível reiniciar o vídeo:",
            erro
          );

        }


        /*
          As duas reproduções são solicitadas
          diretamente no toque da pessoa.
        */

        const promessaVideo = video.play();
        const promessaMusica = music.play();


        promessaMusica.catch(function (erro) {

          console.warn(
            "A música não conseguiu iniciar:",
            erro
          );

        });


        promessaVideo.then(function () {

          iniciado = true;

          /* Esconde a porta quando o vídeo começa */
          capaInicial.style.display = "none";

        }).catch(function (erro) {

          console.error(
            "Erro ao reproduzir o vídeo:",
            erro
          );

          music.pause();

          erroVideo.style.display = "block";

        }).finally(function () {

          iniciando = false;

        });

      }


      /* CLIQUE NA IMAGEM DA PORTA */

      capaInicial.addEventListener(
        "click",
        iniciarConvite
      );


      capaInicial.addEventListener(
        "keydown",
        function (evento) {

          if (
            evento.key === "Enter" ||
            evento.key === " "
          ) {

            evento.preventDefault();
            iniciarConvite();

          }

        }
      );


      /* QUANDO O VÍDEO TERMINAR */

      video.addEventListener(
        "ended",
        function () {

          mostrarTela(screen1);

        }
      );


      /* AVANÇAR PARA O CONVITE PRINCIPAL */

      botaoAvancar.addEventListener(
        "click",
        function () {

          mostrarTela(screen2);

        }
      );


      /* ABRIR VESTIMENTA */

      botaoVestimenta.addEventListener(
        "click",
        function () {

          mostrarTela(screenVestimenta);

        }
      );


      /* VOLTAR AO CONVITE */

      botaoVoltar.addEventListener(
        "click",
        function () {

          mostrarTela(screen2);

        }
      );


      /* RETOMAR MÚSICA SE O SAFARI SUSPENDER */

      document.addEventListener(
        "visibilitychange",
        function () {

          if (
            !document.hidden &&
            iniciado &&
            music.paused
          ) {

            music.play().catch(function (erro) {

              console.warn(
                "A música precisa ser retomada pelo usuário:",
                erro
              );

            });

          }

        }
      );


      /* TENTAR RETOMAR MÚSICA APÓS INTERAÇÃO */

      document.addEventListener(
        "touchend",
        function () {

          if (iniciado && music.paused) {

            music.play().catch(function () {});

          }

        },
        { passive: true }
      );


      /* VERIFICAR ERRO DE CARREGAMENTO DO VÍDEO */

      video.addEventListener(
        "error",
        function () {

          console.error(
            "Não foi possível carregar video.mp4.",
            video.error
          );

        }
      );

    })();

  </script>

</body>
</html>
